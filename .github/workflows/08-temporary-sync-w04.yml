# OPERACAO TEMPORARIA: tentativa unica de encerrar run 04 obsoleto.
# Nao integra a main. Nenhum dado ou pipeline canonico e modificado.
name: TEMP · Encerrar run 04 fantasma
on:
  push:
    branches:
      - ops/w04-dispatch-20261015
    paths:
      - .github/workflows/08-temporary-sync-w04.yml
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Force cancel apenas run 37655505479
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "ops/w04-dispatch-20261015"
          base="https://api.github.com/repos/Rafael-Tinelli/comparador-consorcios-data"
          status="$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$base/actions/runs/37655505479" | python3 -c 'import json,sys;print(json.load(sys.stdin)["status"])')"
          echo "ORPHAN_STATUS_BEFORE=$status"
          if [ "$status" = queued ]; then
            code="$(curl -sS -o /tmp/force-cancel-result -w '%{http_code}' \
              -X POST -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "$base/actions/runs/37655505479/force-cancel")"
            echo "ORPHAN_FORCE_CANCEL_HTTP=$code"
            if [ "$code" != "202" ]; then cat /tmp/force-cancel-result; fi
          fi
          echo "ORPHAN_CANCEL_ATTEMPT_FINISHED"
