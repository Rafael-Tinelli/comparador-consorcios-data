name: 06 · Build & Publish Comparador V2

on:
  workflow_dispatch:
  schedule:
    # 10:00 BRT = 13:00 UTC, depois das coletas.
    - cron: "0 13 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: build-publish-comparador-v2
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture input commit
        id: input
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json
          coverage: none
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and test backend
        run: |
          python -m py_compile collectors/bc_segment_taxonomy.py transform/build_release_v2.py transform/read_models_v2_core.py transform/interpretation_v2.py transform/segment_taxonomy_v2.py transform/finalize_v2_release.py scripts/persist_source_state.py scripts/bootstrap_source_states.py scripts/validate_v2_release.py
          pytest -q tests/test_v2_contracts.py tests/test_source_state_v2.py tests/test_interpretation_v2.py tests/test_segment_taxonomy_v2.py
      - name: Bootstrap missing source states
        run: python scripts/bootstrap_source_states.py --config config/provenance_v2.json
      - name: Build canonical release
        id: build
        run: |
          python transform/build_release_v2.py --config config/sources.json --methodology config/methodology_v2.json
          python transform/finalize_v2_release.py --dist-base data/dist-v2 --provenance-config config/provenance_v2.json
      - name: Validate canonical release and HostGator contract
        run: |
          python scripts/validate_v2_release.py \
            --dist-base data/dist-v2 \
            --provenance-config config/provenance_v2.json \
            --deploy-config config/deploy_v2.json
          find hostgator/v2 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/test_hostgator_v2.php data/dist-v2
          if [ -d data/dist-v2/seo ] && find data/dist-v2/seo -type f -name '*.json' -print -quit | grep -q .; then
            echo "SEO residual na release data-only" >&2
            exit 1
          fi
      - name: Refuse stale publication base
        run: |
          set -Eeuo pipefail
          git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse refs/remotes/origin/$GITHUB_REF_NAME)"
          input_sha="${{ steps.input.outputs.sha }}"
          if [ "$remote_sha" != "$input_sha" ]; then
            echo "Branch avançou durante o build: input=$input_sha remote=$remote_sha" >&2
            exit 42
          fi
      - name: Commit canonical release and source states
        if: steps.build.outputs.mode_used == 'build-release-v2-data-only'
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/dist-v2 data/source_state
          if git diff --cached --quiet; then
            echo "Release já canônica; nenhum commit necessário."
            exit 0
          fi
          git commit -m "chore(v2): publica release canônica"
          git push origin "HEAD:$GITHUB_REF_NAME"
