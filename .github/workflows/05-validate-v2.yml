name: 05 · Validate Comparador V2

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "collectors/**"
      - "transform/**"
      - "scripts/**"
      - "hostgator/v2/**"
      - "tests/**"
      - "config/**"
      - "data/raw/**"
      - "data/stage/**"
      - "data/source_state/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json
          coverage: none
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: DIAGNOSTICO TEMPORARIO — HTTP ConsorcioBD no runner (somente PR)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import zipfile
          import requests

          cfg = json.load(open("config/sources.json", encoding="utf-8"))
          source = cfg["sources"]["bc_consorciobd"]
          base = source["direct_download"]["base_url"].rstrip("/")
          portal = source["official_page_url"]
          collector_ua = cfg["defaults"]["user_agent"]
          browser_ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36"
          expected_may_sha = "f78835875b54eac2996896c84bd7fb416669edb8e0307cf7c9a781ff34c71247"
          s = requests.Session()
          s.trust_env = True

          def probe(month, method, ua_label, ua):
              url = f"{base}/{month}Consorcios.zip"
              headers = {"Accept": "*/*", "User-Agent": ua, "Referer": portal}
              print(f"BEGIN month={month} method={method} ua={ua_label}", flush=True)
              try:
                  with s.request(method, url, headers=headers, timeout=(8, 20), allow_redirects=True, stream=True) as r:
                      print(json.dumps({
                          "http": r.status_code,
                          "final_url": r.url,
                          "content_type": r.headers.get("Content-Type"),
                          "content_length": r.headers.get("Content-Length"),
                          "server": r.headers.get("Server"),
                          "redirects": len(r.history),
                          "collector_header_ok": (
                              r.status_code == 200 and r.url.lower().endswith(".zip")
                              and "text/html" not in (r.headers.get("Content-Type") or "").lower()
                          )
                      }, ensure_ascii=False), flush=True)
                      if method == "GET":
                          content = bytearray()
                          for chunk in r.iter_content(chunk_size=65536):
                              if not chunk:
                                  continue
                              content.extend(chunk)
                              if len(content) > 3000000:
                                  print("body_aborted_over_3mb", flush=True)
                                  break
                          raw = bytes(content)
                          digest = hashlib.sha256(raw).hexdigest()
                          print(f"body_bytes={len(raw)} prefix_hex={raw[:16].hex()} sha256={digest}", flush=True)
                          if month == "202605":
                              print(f"matches_known_approved_sha={digest == expected_may_sha}", flush=True)
                          try:
                              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                                  print(f"ZIP_VALID=YES members={archive.namelist()[:8]!r} bad_member={archive.testzip()!r}", flush=True)
                          except Exception as exc:
                              print(f"ZIP_VALID=NO error={type(exc).__name__}: {str(exc)[:180]}", flush=True)
                              print(f"body_preview={raw[:120]!r}", flush=True)
              except Exception as exc:
                  print(f"REQUEST_EXCEPTION={type(exc).__name__}: {str(exc)[:400]}", flush=True)
              print("END", flush=True)

          print("GITHUB_RUNNER_HTTP_DIAG_BEGIN", flush=True)
          for month in ("202605", "202606"):
              probe(month, "HEAD", "collector", collector_ua)
              probe(month, "GET", "collector", collector_ua)
          probe("202605", "GET", "browser", browser_ua)
          print("GITHUB_RUNNER_HTTP_DIAG_FINISHED", flush=True)
          PY
      - name: Compile canonical backend
        run: |
          python -m py_compile \
            collectors/bc_segment_taxonomy.py \
            transform/build_release_v2.py \
            transform/read_models_v2_core.py \
            transform/interpretation_v2.py \
            transform/segment_taxonomy_v2.py \
            transform/finalize_v2_release.py \
            scripts/persist_source_state.py \
            scripts/bootstrap_source_states.py \
            scripts/validate_v2_release.py
      - name: Run unit contracts
        run: pytest -q tests/test_v2_contracts.py tests/test_source_state_v2.py tests/test_interpretation_v2.py tests/test_segment_taxonomy_v2.py
      - name: Lint HostGator publisher
        run: |
          find hostgator/v2 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/test_hostgator_v2.php
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80300) { fwrite(STDERR, PHP_VERSION."\n"); exit(1); } echo "PHP=".PHP_VERSION."\n";'
      - name: Bootstrap source state fixture
        run: python scripts/bootstrap_source_states.py --config config/provenance_v2.json
      - name: Build isolated release
        run: |
          rm -rf /tmp/consorcio-v2-dist
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/sources.json").read_text(encoding="utf-8"))
          cfg["defaults"]["dist_base_dir"] = "/tmp/consorcio-v2-dist"
          Path("/tmp/sources-v2.json").write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python transform/build_release_v2.py --config /tmp/sources-v2.json --methodology config/methodology_v2.json
          python transform/finalize_v2_release.py --dist-base /tmp/consorcio-v2-dist --provenance-config config/provenance_v2.json
      - name: Validate isolated release
        run: |
          python scripts/validate_v2_release.py \
            --dist-base /tmp/consorcio-v2-dist \
            --provenance-config config/provenance_v2.json \
            --audit-baseline config/audit_baseline_v2.json
          if [ -d /tmp/consorcio-v2-dist/seo ] && find /tmp/consorcio-v2-dist/seo -type f -name '*.json' -print -quit | grep -q .; then
            echo "SEO residual na release data-only" >&2
            exit 1
          fi
          php tests/test_hostgator_v2.php /tmp/consorcio-v2-dist
      - name: Assert V1 is absent
        run: |
          test ! -e transform/build_read_models.py
          test ! -e transform/build_read_models_v2.py
          test ! -e transform/_read_models_v2_core_legacy.py
          test ! -e config/deploy.json
          test ! -e config/scoring_rules.json
          test ! -e config/product_rules.json
          test ! -e config/seo_routes.json
          test ! -d data/dist
          ! find .github/workflows -maxdepth 1 -type f \( -name '08-*' -o -name '09-*' -o -name '10-*' -o -name '11-*' -o -name '12-*' \) -print -quit | grep -q .
          echo "LEGACY_V1_ABSENT=PASS"
