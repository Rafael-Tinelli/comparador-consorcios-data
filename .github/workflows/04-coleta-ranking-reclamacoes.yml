name: 04 · Coleta Reclamações BCB

on:
  workflow_dispatch:
  schedule:
    # 06:40 BRT = 09:40 UTC.
    - cron: "40 9 7 * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: coleta-ranking-reclamacoes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure runtime directories
        run: mkdir -p data/raw/bc/ranking_reclamacoes data/stage/ranking_reclamacoes data/runtime data/source_state
      - name: Run collector
        id: collect
        run: |
          python collectors/bc_ranking_reclamacoes.py \
            --config config/sources.json \
            --source bc_ranking_reclamacoes
      - name: Persist source check state
        if: always()
        run: |
          python scripts/persist_source_state.py \
            --source bc_ranking_reclamacoes \
            --runtime data/runtime/bc_ranking_reclamacoes.json \
            --snapshot data/raw/bc/ranking_reclamacoes/latest.json \
            --content-file data/raw/bc/ranking_reclamacoes/latest_source.csv \
            --state data/source_state/bc_ranking_reclamacoes.json \
            --collector-outcome "${{ steps.collect.outcome }}" \
            --accepted-mode direct-content-download \
            --competence-mode auto
      - name: Commit approved data and source state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/source_state/bc_ranking_reclamacoes.json
          if [ "${{ steps.collect.outcome }}" = "success" ] && [ "${{ steps.collect.outputs.mode_used }}" = "direct-content-download" ]; then
            git add -f data/raw/bc/ranking_reclamacoes/latest.json data/raw/bc/ranking_reclamacoes/latest_source.csv data/stage/ranking_reclamacoes/ranking_reclamacoes_consorcios.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): registra reclamações BCB e estado da fonte"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Enforce homologated mode
        if: always() && steps.collect.outcome == 'success' && steps.collect.outputs.mode_used != 'direct-content-download'
        run: exit 1
