name: 11 · Validate Comparador V2

on:
  pull_request:
    paths:
      - "transform/build_read_models_v2.py"
      - "transform/finalize_v2_release.py"
      - "scripts/persist_source_state.py"
      - "scripts/bootstrap_source_states.py"
      - "scripts/validate_v2_release.py"
      - "hostgator/v2/**"
      - "tests/**"
      - "config/methodology_v2.json"
      - "config/provenance_v2.json"
      - "config/audit_baseline_v2.json"
      - "config/deploy_v2.json"
      - "config/series_map.json"
      - "data/raw/**"
      - "data/stage/**"
      - "data/source_state/**"
      - ".github/workflows/11-validate-v2.yml"
      - ".github/workflows/12-build-publish-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json
          coverage: none

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile V2 backend
        run: |
          python -m py_compile \
            transform/build_read_models_v2.py \
            transform/finalize_v2_release.py \
            scripts/persist_source_state.py \
            scripts/bootstrap_source_states.py \
            scripts/validate_v2_release.py

      - name: Run V2 unit contracts
        run: pytest -q tests/test_v2_contracts.py tests/test_source_state_v2.py

      - name: Lint HostGator V2 PHP
        run: |
          find hostgator/v2 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/test_hostgator_v2.php
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80300) { fwrite(STDERR, PHP_VERSION."\n"); exit(1); } echo "PHP=".PHP_VERSION."\n";'

      - name: Bootstrap source state fixture
        run: python scripts/bootstrap_source_states.py --config config/provenance_v2.json

      - name: Prepare isolated V2 output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path("config/sources.json").read_text(encoding="utf-8"))
          src.setdefault("defaults", {})["dist_base_dir"] = "/tmp/consorcio-v2-dist"
          Path("/tmp/sources-v2.json").write_text(
              json.dumps(src, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build V2 in isolation
        run: |
          python transform/build_read_models_v2.py \
            --config /tmp/sources-v2.json \
            --methodology config/methodology_v2.json \
            --seo-routes config/seo_routes.json

      - name: Attach source provenance
        run: |
          python transform/finalize_v2_release.py \
            --dist-base /tmp/consorcio-v2-dist \
            --provenance-config config/provenance_v2.json

      - name: Audit acceptance and release gates
        run: |
          python scripts/validate_v2_release.py \
            --dist-base /tmp/consorcio-v2-dist \
            --provenance-config config/provenance_v2.json \
            --audit-baseline config/audit_baseline_v2.json

      - name: HostGator V2 negative tests
        run: php tests/test_hostgator_v2.php /tmp/consorcio-v2-dist

      - name: Package V2 preview
        if: always()
        run: |
          rm -rf v2-artifact-preview
          mkdir -p v2-artifact-preview
          if [ -d /tmp/consorcio-v2-dist ]; then
            cp -R /tmp/consorcio-v2-dist/. v2-artifact-preview/
          fi
          mkdir -p v2-artifact-preview/source_state
          cp data/source_state/*.json v2-artifact-preview/source_state/ 2>/dev/null || true
          cp data/runtime/build_read_models_v2.json v2-artifact-preview/ 2>/dev/null || true

      - name: Upload V2 preview
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: comparador-v2-preview
          path: v2-artifact-preview/
          if-no-files-found: warn
          retention-days: 15
